name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22.13.0, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: launcher installs deps from the registry into CLAUDE_PLUGIN_DATA
        env:
          SCOPED_NETWORK_TESTS: "1"
        run: node --test --test-name-pattern "from the registry" test/launcher.test.mjs

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - run: npm install -g @anthropic-ai/claude-code
      - name: claude plugin validate --strict
        run: |
          claude plugin validate .claude-plugin/plugin.json --strict
          claude plugin validate .claude-plugin/marketplace.json --strict
          claude plugin validate . --strict
          claude plugin validate commands --strict
